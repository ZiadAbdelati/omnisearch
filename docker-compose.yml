services:
  omnisearch:
    build: .
    container_name: omnisearch
    ports:
      - "8787:8787"
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-long-random-string}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me-admin-token}
      HOST: "0.0.0.0"
      PORT: "8787"
      DATABASE_PATH: /data/gateway.db
      # Seed a SearXNG account on first boot if DB empty
      DEFAULT_SEARXNG_URL: ${DEFAULT_SEARXNG_URL:-http://searxng:8080}
    volumes:
      - omnisearch-data:/data
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  omnisearch-data:
